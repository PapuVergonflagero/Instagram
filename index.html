<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #fafafa;
            font-family: Arial, Helvetica, sans-serif;
            color: #262626;
        }

        .container {
            width: 350px;
            margin: 70px auto 0;
            text-align: center;
        }

        .login-box {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 40px 40px 25px;
        }

        .logo {
            font-family: cursive;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        input {
            width: 100%;
            height: 38px;
            margin-bottom: 7px;
            padding: 9px;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            background: #fafafa;
            font-size: 12px;
        }

        button {
            width: 100%;
            height: 32px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #0095f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1877f2;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 25px 0;
            color: #737373;
            font-size: 13px;
            font-weight: bold;
        }

        .line {
            height: 1px;
            background: #dbdbdb;
            flex: 1;
        }

        .facebook {
            color: #385185;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .forgot {
            color: #00376b;
            font-size: 12px;
        }

        .signup {
            margin-top: 10px;
            background: white;
            border: 1px solid #dbdbdb;
            padding: 25px;
            font-size: 14px;
        }

        .signup span {
            color: #0095f6;
            font-weight: bold;
        }

        .loading {
            display: none;
            margin-top: 25px;
        }

        .spinner {
            width: 35px;
            height: 35px;
            border: 4px solid #ddd;
            border-top: 4px solid #555;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        .loading-text {
            margin-top: 15px;
            color: #737373;
            font-size: 13px;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        .warning {
            display: none;
            margin-top: 20px;
            color: #ed4956;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="login-box">

            <div class="logo">Instagram</div>

            <!-- Estos campos son SOLO visuales -->
            <input type="text" placeholder="Teléfono, usuario o correo electrónico">
            <input type="password" placeholder="Contraseña">

            <button onclick="fakeLogin()">Iniciar sesión</button>

            <div class="or">
                <div class="line"></div>
                O
                <div class="line"></div>
            </div>

            <div class="facebook">
                Iniciar sesión con Facebook
            </div>

            <div class="forgot">
                ¿Has olvidado la contraseña?
            </div>

        </div>

        <div class="signup">
            ¿No tienes una cuenta? <span>Regístrate</span>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">
                Iniciando sesión...
            </div>
        </div>

        <div class="warning" id="warning">
            No se pudo iniciar sesión. Inténtalo de nuevo.
        </div>

    </div>

    <script>
        function fakeLogin() {

            // No se guarda ni se envía ningún dato.
            document.querySelector(".login-box").style.display = "none";
            document.querySelector(".signup").style.display = "none";

            document.getElementById("loading").style.display = "block";

            setTimeout(() => {
                document.getElementById("loading").style.display = "none";
                document.getElementById("warning").style.display = "block";
            }, 4000);
        }
    </script>

</body>
</html>
