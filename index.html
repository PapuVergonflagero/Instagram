<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #111;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .phone {
            width: 390px;
            height: 760px;
            max-width: 100vw;
            max-height: 100vh;
            background: #181818;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .video-area {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 35%, #555 0%, #292929 25%, #111 65%);
            position: relative;
        }

        .top {
            position: absolute;
            top: 18px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            z-index: 2;
        }

        .title {
            font-weight: bold;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .spinner {
            width: 55px;
            height: 55px;
            border: 5px solid rgba(255,255,255,.25);
            border-top: 5px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        .loading-text {
            margin-top: 18px;
            font-size: 14px;
            color: #ddd;
        }

        .bottom {
            position: absolute;
            bottom: 20px;
            left: 18px;
            right: 18px;
        }

        .progress {
            height: 3px;
            background: rgba(255,255,255,.3);
            overflow: hidden;
            border-radius: 5px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: white;
            animation: progress 6s linear infinite;
        }

        .info {
            margin-top: 15px;
        }

        .username {
            font-weight: bold;
        }

        .description {
            margin-top: 6px;
            color: #ddd;
            font-size: 14px;
        }

        .error {
            display: none;
            position: absolute;
            inset: 0;
            background: #111;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .error-box {
            max-width: 280px;
        }

        .error-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .error-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .error-text {
            color: #aaa;
            font-size: 14px;
            line-height: 1.5;
        }

        .prank {
            display: none;
            margin-top: 25px;
            font-size: 22px;
            font-weight: bold;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            80% {
                width: 95%;
            }

            100% {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="phone">

        <div class="video-area">

            <div class="top">
                <div class="title">Video</div>
                <div>⋯</div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">
                    Cargando video...
                </div>
            </div>

            <div class="bottom">
                <div class="progress">
                    <div class="progress-bar"></div>
                </div>

                <div class="info">
                    <div class="username">@video_usuario</div>
                    <div class="description">
                        Mira este video 
                    </div>
                </div>
            </div>

            <div class="error" id="error">

                <div class="error-box">

                    <div class="error-icon">Danisha Sharlyn Espinoza Valverde</div>

                    <div class="error-title">
                        
                    </div>HOSPITAL CENTRAL SAN JOSE

                    <div class="error-text">
                       att. la verdadera novia de derick
                       para: la que cree que derick la ama
                    </div>

                    <div class="prank" id="prank">
                      30 3 2014
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>
        setTimeout(() => {

            document.getElementById("loading").style.display = "none";
            document.getElementById("error").style.display = "flex";

            setTimeout(() => {
                document.getElementById("prank").style.display = "block";
            }, 3000);

        }, 8000);
    </script>

</body>
</html>
